# Vigil derrière nginx (TLS terminé par nginx). Vigil écoute en local :
#   vigil serve -addr 127.0.0.1:8080 -behind-proxy -base-url https://vigil.example.org
# Copiez ce fichier dans /etc/nginx/conf.d/vigil.conf, adaptez server_name et
# les chemins du certificat, puis : nginx -t && systemctl reload nginx
# Voir docs/INSTALL.md.

server {
    listen 80;
    listen [::]:80;
    server_name vigil.example.org;
    return 301 https://$host$request_uri;
}

server {
    # nginx >= 1.25.1 : ajoutez « http2 on; » (versions antérieures : « listen 443 ssl http2; »).
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vigil.example.org;

    ssl_certificate     /etc/ssl/vigil/fullchain.pem;
    ssl_certificate_key /etc/ssl/vigil/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens       off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Imports SBOM et VEX : Vigil accepte jusqu'à 21 Mio par requête.
    client_max_body_size 22m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # Indispensable : Vigil compare l'en-tête Origin des formulaires à Host
        # (sinon « Origine refusée »).
        proxy_set_header Host $host;
        # Avec -behind-proxy, Vigil limite les tentatives de connexion par client
        # d'après la dernière adresse de X-Forwarded-For, celle qu'ajoute nginx.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Vigil coupe toute réponse après 120 s ; le proxy attend un peu plus.
        proxy_read_timeout 130s;
    }
}
