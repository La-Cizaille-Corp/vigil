{{define "layout"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Vigil</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">Vigil</a>
  {{if .User}}
  <nav>
    <a href="/">Tableau de bord</a>
    <a href="/assets">Inventaire</a>
    <a href="/findings">Vulnérabilités</a>
    <a href="/digests">Digests</a>
  </nav>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <span class="muted">{{.User.Username}} ({{.User.Role}})</span>
    <button type="submit" class="link">Déconnexion</button>
  </form>
  {{end}}
</header>
<main>
  <h1>{{.Title}}</h1>
  {{if .Flash}}<p class="flash">{{.Flash}}</p>{{end}}
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  {{template "content" .}}
</main>
</body>
</html>{{end}}
