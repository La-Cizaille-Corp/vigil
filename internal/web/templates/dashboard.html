{{define "content"}}
{{$counts := .Data.Counts}}
<section class="tiles">
  <div class="tile"><span class="num">{{.Data.AssetCount}}</span> actifs suivis</div>
  {{range statuses}}
  <a class="tile" href="/findings?status={{.Value}}"><span class="num">{{index $counts .Value}}</span> {{.Label}}</a>
  {{end}}
</section>

{{if can .User.Role "analyst"}}
<form method="post" action="/sync" class="inline">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <button type="submit">Synchroniser maintenant</button>
</form>
{{end}}

<h2>Nouvelles vulnérabilités (7 derniers jours)</h2>
{{template "findingTable" .Data.Recent}}
{{end}}
